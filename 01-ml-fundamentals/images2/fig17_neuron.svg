<svg xmlns='http://www.w3.org/2000/svg' width='860' height='425' viewBox='0 0 860 425' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>
<rect width='860' height='425' fill='#fcfcfb' rx='8'/>
<text x='24' y='32' font-size='16' font-weight='700' fill='#0b0b0b'>One artificial neuron</text>
<text x='24' y='53' font-size='13' fill='#52514e'>inputs × weights, add the bias, pass through an activation function</text>
<line x1='110' y1='110' x2='352' y2='200' stroke='#52514e' stroke-width='1.8'/><text x='218.9' y='142.5' font-size='12.5' fill='#0b0b0b' font-weight='600' text-anchor='middle' stroke='#fcfcfb' stroke-width='4' paint-order='stroke'>w₁ = 0.5</text>
<circle cx='90' cy='110' r='24' fill='#eef3fb' stroke='#2a78d6' stroke-width='1.8'/><text x='90' y='115' font-size='14' font-weight='600' fill='#0b0b0b' text-anchor='middle'>x₁</text>
<text x='50' y='115' font-size='12.5' fill='#52514e' text-anchor='end'>2</text>
<line x1='110' y1='200' x2='352' y2='200' stroke='#52514e' stroke-width='1.8'/><text x='218.9' y='192.0' font-size='12.5' fill='#0b0b0b' font-weight='600' text-anchor='middle' stroke='#fcfcfb' stroke-width='4' paint-order='stroke'>w₂ = −1.0</text>
<circle cx='90' cy='200' r='24' fill='#eef3fb' stroke='#2a78d6' stroke-width='1.8'/><text x='90' y='205' font-size='14' font-weight='600' fill='#0b0b0b' text-anchor='middle'>x₂</text>
<text x='50' y='205' font-size='12.5' fill='#52514e' text-anchor='end'>3</text>
<line x1='110' y1='290' x2='352' y2='200' stroke='#52514e' stroke-width='1.8'/><text x='218.9' y='241.5' font-size='12.5' fill='#0b0b0b' font-weight='600' text-anchor='middle' stroke='#fcfcfb' stroke-width='4' paint-order='stroke'>w₃ = 2.0</text>
<circle cx='90' cy='290' r='24' fill='#eef3fb' stroke='#2a78d6' stroke-width='1.8'/><text x='90' y='295' font-size='14' font-weight='600' fill='#0b0b0b' text-anchor='middle'>x₃</text>
<text x='50' y='295' font-size='12.5' fill='#52514e' text-anchor='end'>1</text>
<line x1='400' y1='330' x2='400' y2='246' stroke='#52514e' stroke-width='1.8'/>
<path d='M400,246 L403.9,255.2 L396.1,255.2 Z' fill='#52514e'/>
<rect x='360' y='330' width='80' height='30' rx='6' fill='#ffffff' stroke='#52514e' stroke-width='1.5'/>
<text x='400' y='350' font-size='13' font-weight='600' fill='#0b0b0b' text-anchor='middle'>b = 0.5</text>
<text x='450' y='350' font-size='12' fill='#52514e'>bias</text>
<circle cx='400' cy='200' r='46' fill='#fdf0ea' stroke='#eb6834' stroke-width='1.8'/><text x='400' y='205' font-size='26' font-weight='600' fill='#0b0b0b' text-anchor='middle'>Σ</text>
<text x='400' y='142' font-size='12' fill='#52514e' text-anchor='middle'>weighted sum</text>
<line x1='446' y1='200' x2='560' y2='200' stroke='#52514e' stroke-width='1.8'/><text x='503.0' y='190.0' font-size='12.5' fill='#0b0b0b' font-weight='600' text-anchor='middle' stroke='#fcfcfb' stroke-width='4' paint-order='stroke'>z = 0.5</text>
<path d='M560,200 L550.8,203.9 L550.8,196.1 Z' fill='#52514e'/>
<rect x='562' y='166' width='110' height='68' rx='10' fill='#edf8f3' stroke='#1baf7a' stroke-width='1.6'/>
<text x='617' y='196' font-size='15' font-weight='700' fill='#0b0b0b' text-anchor='middle'>f(z)</text>
<text x='617' y='216' font-size='12' fill='#52514e' text-anchor='middle'>activation</text>
<line x1='672' y1='200' x2='760' y2='200' stroke='#52514e' stroke-width='1.8'/><text x='716.0' y='190.0' font-size='12.5' fill='#0b0b0b' font-weight='600' text-anchor='middle' stroke='#fcfcfb' stroke-width='4' paint-order='stroke'>a = 0.62</text>
<path d='M760,200 L750.8,203.9 L750.8,196.1 Z' fill='#52514e'/>
<text x='770' y='205' font-size='13' fill='#0b0b0b' font-weight='600'>output</text>
<text x='24' y='405' font-size='13' fill='#52514e'>z = (2)(0.5) + (3)(−1.0) + (1)(2.0) + 0.5 = 0.5</text>
<text x='420' y='405' font-size='13' fill='#52514e'>a = sigmoid(0.5) = 0.62</text>
</svg>