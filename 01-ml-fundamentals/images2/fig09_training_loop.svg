<svg xmlns='http://www.w3.org/2000/svg' width='870' height='395' viewBox='0 0 870 395' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'>
<rect width='870' height='395' fill='#fcfcfb' rx='8'/>
<text x='24' y='34' font-size='16' font-weight='700' fill='#0b0b0b'>The training loop</text>
<text x='24' y='56' font-size='13' fill='#52514e'>predict → measure the error → adjust the parameters → repeat</text>
<rect x='30' y='130' width='140' height='70' rx='10' fill='#ffffff' stroke='#52514e' stroke-width='1.5'/><text x='100.0' y='165.0' font-size='15' font-weight='700' fill='#0b0b0b' text-anchor='middle'>Training data</text><text x='100.0' y='185.0' font-size='12' fill='#52514e' text-anchor='middle'>features X</text><rect x='260' y='130' width='140' height='70' rx='10' fill='#eef3fb' stroke='#2a78d6' stroke-width='1.5'/><text x='330.0' y='165.0' font-size='15' font-weight='700' fill='#0b0b0b' text-anchor='middle'>Model</text><text x='330.0' y='185.0' font-size='12' fill='#52514e' text-anchor='middle'>parameters w, b</text><rect x='490' y='130' width='140' height='70' rx='10' fill='#ffffff' stroke='#52514e' stroke-width='1.5'/><text x='560.0' y='165.0' font-size='15' font-weight='700' fill='#0b0b0b' text-anchor='middle'>Predictions</text><text x='560.0' y='185.0' font-size='12' fill='#52514e' text-anchor='middle'>ŷ</text><rect x='720' y='130' width='140' height='70' rx='10' fill='#fdf0ea' stroke='#eb6834' stroke-width='1.5'/><text x='790.0' y='165.0' font-size='15' font-weight='700' fill='#0b0b0b' text-anchor='middle'>Loss</text><text x='790.0' y='185.0' font-size='12' fill='#52514e' text-anchor='middle'>how wrong? L(y, ŷ)</text><rect x='720' y='64' width='140' height='36' rx='10' fill='#ffffff' stroke='#52514e' stroke-width='1.5'/><text x='790.0' y='87.0' font-size='15' font-weight='400' fill='#0b0b0b' text-anchor='middle'>True labels y</text><rect x='380' y='255' width='200' height='70' rx='10' fill='#edf8f3' stroke='#1baf7a' stroke-width='1.5'/><text x='480.0' y='290.0' font-size='15' font-weight='700' fill='#0b0b0b' text-anchor='middle'>Optimizer</text><text x='480.0' y='310.0' font-size='12' fill='#52514e' text-anchor='middle'>w ← w − η · ∂L/∂w</text><line x1='170' y1='165' x2='258' y2='165' stroke='#52514e' stroke-width='2'/><path d='M258,165 L248.8,168.9 L248.8,161.1 Z' fill='#52514e'/><line x1='400' y1='165' x2='488' y2='165' stroke='#52514e' stroke-width='2'/><path d='M488,165 L478.8,168.9 L478.8,161.1 Z' fill='#52514e'/><text x='444.0' y='155.0' font-size='12' fill='#52514e' text-anchor='middle'>forward pass</text><line x1='630' y1='165' x2='718' y2='165' stroke='#52514e' stroke-width='2'/><path d='M718,165 L708.8,168.9 L708.8,161.1 Z' fill='#52514e'/><text x='674.0' y='155.0' font-size='12' fill='#52514e' text-anchor='middle'>compare</text><line x1='790' y1='100' x2='790' y2='128' stroke='#52514e' stroke-width='2'/><path d='M790,128 L786.1,118.8 L793.9,118.8 Z' fill='#52514e'/><path d='M790,200 L790,290 L595,290' fill='none' stroke='#52514e' stroke-width='2'/><line x1='600' y1='290' x2='582' y2='290' stroke='#52514e' stroke-width='2'/><path d='M582,290 L591.2,286.1 L591.2,293.9 Z' fill='#52514e'/><text x='690' y='280' font-size='12' fill='#52514e' text-anchor='middle'>gradient of the loss</text><path d='M380,290 L330,290 L330,210' fill='none' stroke='#52514e' stroke-width='2'/><line x1='330' y1='215' x2='330' y2='202' stroke='#52514e' stroke-width='2'/><path d='M330,202 L333.9,211.2 L326.1,211.2 Z' fill='#52514e'/><text x='240' y='260' font-size='12' fill='#52514e' text-anchor='middle'>update weights</text><text x='30' y='370' font-size='13' fill='#52514e'>One pass over all the training data = 1 epoch. Repeat until the loss stops improving on the validation set.</text>
</svg>